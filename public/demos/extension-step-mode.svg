    <circle cx="72" cy="702" r="25" fill="#f0523d" stroke="#fff" stroke-width="4"/>
    <text x="72" y="710" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">3</text>
  </g>

  <g data-callout="step-4" data-callout-surface="popup">
    <path d="M103 754 C190 754, 280 754, 390 754" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
    <path d="M103 754 C190 754, 280 754, 390 754" fill="none" stroke="#f0523d" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowHead)"/>
    <circle cx="72" cy="754" r="25" fill="#f0523d" stroke="#fff" stroke-width="4"/>
    <text x="72" y="762" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">4</text>
  </g>

  </g>
