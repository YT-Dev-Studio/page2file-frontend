<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="title description">
  <title id="title">Configure Page 2 File and create a preview</title>
  <desc id="description">The original Page 2 File extension interface with four numbered callouts for format, output style, customization, and preview.</desc>
  <defs>
    <filter id="popupShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1d2f50" flood-opacity=".18"/>
    </filter>
    <marker id="arrowHead" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 18 9 0 18Z" fill="#f0523d"/>
    </marker>
  </defs>
  <rect width="900" height="900" fill="#edf3fa"/>
  <g font-family="Inter, Arial, sans-serif">

    <g data-popup-master="page2file-popup-v3" data-popup-geometry="455x751" transform="translate(365 74)">
      <defs>
        <clipPath id="sourceTitleClip">
          <rect x="91" y="139" width="214" height="21"/>
        </clipPath>
        <clipPath id="sourceUrlClip">
          <rect x="68" y="147" width="342" height="26"/>
        </clipPath>
      </defs>
      <rect x="0" y="0" width="455" height="751" rx="16" fill="#ffffff" stroke="#d3d9e3" stroke-width="2" filter="url(#popupShadow)"/>
      <g data-popup-role="brand-logo" data-bounds="21,31,38,38">
        <rect x="21" y="31" width="38" height="38" rx="8" fill="#102e6f"/>
        <path d="M28 37h17l6 6v18H28z" fill="#f5f8ff"/>
        <path d="M45 37v7h6" fill="#b9d7ff"/>
        <path d="M32 45h10M32 50h8M32 55h6" stroke="#257fe5" stroke-width="1.5"/>
        <circle cx="47" cy="52" r="6.5" fill="none" stroke="#71b7ff" stroke-width="2.2"/>
        <path d="m51.5 56.5 4 4" stroke="#71b7ff" stroke-width="2.2" stroke-linecap="round"/>
        <text x="25" y="66" font-size="5.1" font-weight="700" fill="#fff">page2file</text>
      </g>
      <text x="69" y="58" font-size="25" font-weight="760" fill="#102652">Page 2 File</text>
      <circle cx="380" cy="49" r="5" fill="#168cf2"/>
      <text x="393" y="56" font-size="15" fill="#7b8493">Ready</text>

      <rect x="21" y="85" width="410" height="34" rx="8" fill="#f5f6f8" stroke="#c9ced8"/>
      <rect x="21" y="85" width="205" height="34" rx="8" fill="#2188ef"/>
      <text x="123" y="107" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Current tab</text>
      <text x="329" y="107" text-anchor="middle" font-size="15" font-weight="500" fill="#263247">By URL</text>

      <rect x="21" y="131" width="410" height="59" rx="10" fill="#fff" stroke="#c9ced8"/>
             <g data-popup-role="source-favicon" data-bounds="31,140,42,42">
     <rect x="31" y="140" width="42" height="42" rx="8" fill="#fff" stroke="#c9ced8"/>
     <path d="M40 148h22l4 4v22H40z" fill="#fff" stroke="#111" stroke-width="2.4"/>
     <text x="52" y="171" text-anchor="middle" font-family="Georgia, serif" font-size="23" font-weight="800" fill="#111">N</text>
   </g>
             <text data-source-title="true" data-source-title-truncated="false" data-safe-zone="91,139,214,21" clip-path="url(#sourceTitleClip)" x="91" y="155" font-size="15" font-weight="700" fill="#17284d">Product research notes</text>
             <text x="91" y="177" font-size="12" fill="#8a93a2">notion.so</text>
             <g data-popup-role="capture-status" data-bounds="317,149,114,22">
               <circle cx="322" cy="160" r="5" fill="#28ad64"/>
               <text x="334" y="166" font-size="12" font-weight="650" fill="#29955c">Ready to capture</text>
             </g>

      <text x="21" y="222" font-size="17" font-weight="750" fill="#13264d">Choose format</text>
      <rect x="21" y="235" width="198" height="171" rx="12" fill="#fff9f7" stroke="#f0523d" stroke-width="1.8"/>
      <rect x="232" y="235" width="199" height="171" rx="12" fill="#fff" stroke="#cbd1da" stroke-width="1"/>
      <circle cx="41" cy="255" r="9" fill="#f0523d"/><path d="m37 255 3 3 6-7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="252" cy="255" r="9" fill="#fff" stroke="#9aa5b5" stroke-width="1.6"/>

    <g data-popup-role="pdf-icon" data-bounds="94,264,49,66">
      <path d="M101 264H130L143 277V323A7 7 0 0 1 136 330H101A7 7 0 0 1 94 323V271A7 7 0 0 1 101 264Z" fill="#f0443e"/>
      <path d="M130 264V277H143" fill="#ffaca0"/>
      <path d="M105 319c8-12 14-26 17-40 1-6 0-9-2-9-3 0-3 7-2 16 2 11 7 23 15 32 5 6 8 6 10 4 1-2-3-5-9-6-11-3-23-1-33 2-7 3-11 6-10 9 2 2 8 0 15-5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>


    <g data-popup-role="powerpoint-icon" data-bounds="306,264,49,66">
      <path d="M313 264H342L355 277V323A7 7 0 0 1 348 330H313A7 7 0 0 1 306 323V271A7 7 0 0 1 313 264Z" fill="#ff7a19"/>
      <path d="M342 264V277H355" fill="#ffb58a"/>
      <text x="330.5" y="313" text-anchor="middle" font-size="31" font-weight="800" fill="#fff">P</text>
    </g>

      <text data-popup-role="pdf-title" data-bounds="75,337,90,29" x="120" y="360" text-anchor="middle" font-size="24" font-weight="760" fill="#102652">PDF</text>
      <text data-popup-role="powerpoint-title" data-bounds="265,339,134,27" x="332" y="360" text-anchor="middle" font-size="22" font-weight="760" fill="#102652">PowerPoint</text>
      <text data-popup-role="pdf-description" data-bounds="30,374,180,15" x="120" y="385" text-anchor="middle" font-size="12" fill="#7e8796">For sharing and archiving</text>
      <text data-popup-role="powerpoint-description" data-bounds="242,374,179,15" x="332" y="385" text-anchor="middle" font-size="12" fill="#7e8796">For presenting and editing</text>

      <text x="21" y="442" font-size="17" font-weight="750" fill="#13264d">Output style</text>
      <rect x="21" y="452" width="410" height="52" rx="9" fill="#fff9f7" stroke="#f0523d" stroke-width="1.8"/>
      <circle cx="41" cy="478" r="9" fill="#f0523d"/><path d="m37 478 3 3 6-7" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="71" y="474" font-size="14" font-weight="720" fill="#1c2d50">Accurate copy</text>
      <text x="71" y="491" font-size="11.5" fill="#7d8796">Preserves the page appearance</text>
      <path d="m407 470 7 8-7 8" fill="none" stroke="#626e7e" stroke-width="1.8"/>

      <rect x="21" y="511" width="410" height="52" rx="9" fill="#fff" stroke="#d0d5dd" stroke-width="1"/>
      <circle cx="41" cy="537" r="9" fill="#fff" stroke="#9aa5b5" stroke-width="1.6"/>
      <text x="71" y="533" font-size="14" font-weight="720" fill="#1c2d50">Editable document</text>
      <text x="71" y="550" font-size="11.5" fill="#7d8796">Rebuilds supported text and links</text>
      <path d="m407 529 7 8-7 8" fill="none" stroke="#626e7e" stroke-width="1.8"/>

      <text x="21" y="594" font-size="17" font-weight="750" fill="#13264d">Customize</text>
      <path d="m411 586 7 7 7-7" fill="none" stroke="#465469" stroke-width="1.8"/>
      <rect x="21" y="608" width="410" height="40" rx="9" fill="#fff" stroke="#d0d5dd"/>
      <rect x="32" y="620" width="15" height="15" rx="3" fill="#fff" stroke="#9da7b5" stroke-width="1.8"/>
      <text x="55" y="632" font-size="11.5" fill="#667184">Remove images</text>
      <path d="M150 614v28M289 614v28" stroke="#d5d9e0"/>
      <rect x="163" y="620" width="15" height="15" rx="3" fill="#fff" stroke="#9da7b5" stroke-width="1.8"/>
      <text x="186" y="632" font-size="11.5" fill="#667184">Remove links</text>
      <rect x="302" y="620" width="15" height="15" rx="3" fill="#fff" stroke="#9da7b5" stroke-width="1.8"/>
      <text x="325" y="632" font-size="11.5" fill="#667184">Remove styling</text>

      <rect x="21" y="658" width="410" height="45" rx="8" fill="#2188ef"/>
      <path data-popup-role="preview-icon" data-bounds="153,670,21,22" d="M153 671h13l7 7v13h-20zM166 671v7h7" fill="none" stroke="#fff" stroke-width="2"/>
      <text data-popup-role="preview-text" data-bounds="188,670,120,24" x="188" y="688" font-size="18" font-weight="700" fill="#fff">Preview PDF</text>
      <text x="226" y="729" text-anchor="middle" font-size="11.5" fill="#7c8696">Uses this tab only · Temporary processing</text>
    </g>


  <g data-callout="step-1" data-callout-surface="popup">
    <path d="M103 329 C190 329, 280 329, 390 329" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
    <path d="M103 329 C190 329, 280 329, 390 329" fill="none" stroke="#f0523d" stroke-width="7" stroke-linecap="round" marker-end="url(#arrowHead)"/>
    <circle cx="72" cy="329" r="25" fill="#f0523d" stroke="#fff" stroke-width="4"/>
    <text x="72" y="337" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">1</text>
  </g>

  <g data-callout="step-2" data-callout-surface="popup">
    <path d="M103 552 C190 552, 280 552, 390 552" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
