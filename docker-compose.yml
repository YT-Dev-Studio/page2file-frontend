name: page2file-frontend

services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?NEXT_PUBLIC_SITE_URL is required}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_ENABLE_INDEXING: ${NEXT_PUBLIC_ENABLE_INDEXING:-false}
        NEXT_PUBLIC_LEGAL_REVIEWED: ${NEXT_PUBLIC_LEGAL_REVIEWED:-false}
        NEXT_PUBLIC_ENABLE_CONVERSION: ${NEXT_PUBLIC_ENABLE_CONVERSION:-false}
        NEXT_PUBLIC_CHROME_EXTENSION_URL: ${NEXT_PUBLIC_CHROME_EXTENSION_URL:-}
        NEXT_PUBLIC_PAGE2PDF_GPT_URL: ${NEXT_PUBLIC_PAGE2PDF_GPT_URL:-}
        NEXT_PUBLIC_WEB2PDF_GPT_URL: ${NEXT_PUBLIC_WEB2PDF_GPT_URL:-}
        NEXT_PUBLIC_HTML2PDF_GPT_URL: ${NEXT_PUBLIC_HTML2PDF_GPT_URL:-}
        NEXT_PUBLIC_ONE_PAGE2POWERPOINT_GPT_URL: ${NEXT_PUBLIC_ONE_PAGE2POWERPOINT_GPT_URL:-}
        NEXT_PUBLIC_WEB2POWERPOINT_GPT_URL: ${NEXT_PUBLIC_WEB2POWERPOINT_GPT_URL:-}
    environment:
      PAGE2FILE_BACKEND_URL: ${PAGE2FILE_BACKEND_URL:?PAGE2FILE_BACKEND_URL is required}
      PAGE2FILE_WEB_KEY_ID: ${PAGE2FILE_WEB_KEY_ID:-web-v1}
      PAGE2FILE_WEB_HMAC_SECRET: ${PAGE2FILE_WEB_HMAC_SECRET:?PAGE2FILE_WEB_HMAC_SECRET is required}
    ports:
      - "127.0.0.1:3000:3000"
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('node:http');const request=http.get('http://127.0.0.1:3000/',(response)=>{response.resume();process.exit(response.statusCode<500?0:1)});request.on('error',()=>process.exit(1));request.setTimeout(2000,()=>request.destroy());",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

networks:
  backend:
    external: true
    name: page2file_host-access
